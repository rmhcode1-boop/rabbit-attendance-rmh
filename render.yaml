# One-click hosting on Render (https://render.com): New → Blueprint → pick this repo.
# A persistent disk is required for the SQLite database, which needs a paid instance type (Starter).
services:
  - type: web
    name: rabbit-attendance-rmh
    runtime: node
    plan: starter
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: rmh-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: SETUP_CODE
        generateValue: true
